  <script type="text/babel" data-presets="env,react">
    const { motion } = window.Motion;

    /* ============== BlurText ============== */
    function BlurText({ text, className }) {
      const [visible, setVisible] = useState(false);
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(
          (entries) => entries.forEach((e) => { if (e.isIntersecting) setVisible(true); }),
          { threshold: 0.1 }
        );
        obs.observe(el);
        return () => obs.disconnect();
      }, []);

      const words = text.split(" ");
      return (
        <p ref={ref} className={className} style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", rowGap: "0.1em" }}>
          {words.map((w, i) => (
            <motion.span
              key={i}
              initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
              animate={visible ? {
                filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
                opacity: [0, 0.5, 1],
                y: [50, -5, 0],
              } : {}}
              transition={{ duration: 0.7, times: [0, 0.5, 1], ease: "easeOut", delay: (i * 100) / 1000 }}
              style={{ display: "inline-block", marginRight: "0.28em" }}
            >
              {w}
            </motion.span>
          ))}
        </p>
      );
    }

    /* ============== HERO ============== */
    function Hero() {
      const videoRef = useRef(null);
      const [muted, setMuted] = useState(true);
      const [showHint, setShowHint] = useState(true);

      useEffect(() => {
        const t = setTimeout(() => setShowHint(false), 6000);
        return () => clearTimeout(t);
      }, []);

      const toggleMute = () => {
        const v = videoRef.current;
        if (!v) return;
        const newMuted = !muted;
        v.muted = newMuted;
        if (!newMuted && v.paused) v.play().catch(() => {});
        setMuted(newMuted);
        setShowHint(false);
      };

      return (
        <section className="relative aspect-video md:aspect-auto md:min-h-screen overflow-hidden bg-black">
          <video
            ref={videoRef}
            src={HERO_VIDEO}
            poster="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1920 1080' preserveAspectRatio='xMidYMid slice'%3E%3Cdefs%3E%3CradialGradient id='a' cx='20%25' cy='25%25' r='55%25'%3E%3Cstop offset='0%25' stop-color='%23dcaf69' stop-opacity='.30'/%3E%3Cstop offset='100%25' stop-color='%231a120c' stop-opacity='0'/%3E%3C/radialGradient%3E%3CradialGradient id='b' cx='80%25' cy='78%25' r='60%25'%3E%3Cstop offset='0%25' stop-color='%23b0843e' stop-opacity='.24'/%3E%3Cstop offset='100%25' stop-color='%231a120c' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='1920' height='1080' fill='%231a120c'/%3E%3Crect width='1920' height='1080' fill='url(%23a)'/%3E%3Crect width='1920' height='1080' fill='url(%23b)'/%3E%3Ctext x='960' y='540' font-family='Georgia, serif' font-style='italic' font-size='110' fill='%23faf6ef' fill-opacity='.78' text-anchor='middle' dominant-baseline='middle'%3EMemory Frame%3C/text%3E%3C/svg%3E"
            autoPlay
            muted
            loop
            playsInline
            preload="auto"
            className="absolute inset-0 w-full h-full object-contain md:object-cover object-top z-0"
          />

          {/* Navbar */}
          <nav className="fixed top-4 left-0 right-0 z-50 flex items-center justify-between px-8 lg:px-16">
            <div className="bg-[#faf6ef] w-12 h-12 rounded-full flex items-center justify-center shadow-md">
              <span className="font-heading italic text-2xl text-[#1a120c]">m</span>
            </div>
            <a href="#reserve" className="bg-[#1a120c] text-[#faf6ef] rounded-full px-5 py-2.5 text-sm font-medium flex items-center gap-2 whitespace-nowrap hover:bg-[#2a1f17] transition-colors shadow-md">
              Reserve for $1 <ArrowUpRight className="h-4 w-4"/>
            </a>
          </nav>

          {/* Sound toggle — browser autoplay policy requires user gesture for audio */}
          <motion.button
            onClick={toggleMute}
            initial={{ opacity: 0, scale: 0.9, y: 20 }}
            animate={{ opacity: 1, scale: 1, y: 0 }}
            transition={{ duration: 0.6, delay: 1.2, ease: "easeOut" }}
            aria-label={muted ? "Tap to play with sound" : "Mute video"}
            className="absolute z-20 right-6 md:right-12 bottom-28 liquid-glass-strong rounded-full flex items-center justify-center text-white font-medium hover:scale-105 transition-all duration-300 overflow-hidden cursor-pointer"
            style={{ padding: showHint && muted ? "12px 22px" : "14px" }}

        ["Will this work across iPhone, Android, and email?", "Yes. Memory Frame syncs over Wi-Fi from any phone or computer. Your siblings tap a private link you share with them — no app store, no account creation, no learning curve."],
        ["What if Mira shuts down?", "The AI is on a chip inside the frame, not in the cloud. No cloud means no service to lose. The frame your mom has on Year 5 looks exactly like the frame she has on Year 1, even if our website is gone tomorrow."],
        ["What if my parent has dementia?", "Memory Frame may not be the right product for moderate or severe dementia. Recognition-based displays can be unsettling. Please reach out before reserving — we'll talk it through honestly with you."],
        ["Who can see my photos?", "Only the people you share the photo link with. No one at Mira. No AI vendor. No cloud provider. After Wi-Fi setup, the frame can be put in airplane mode and the AI keeps working."],
        ["When will it ship?", "We're finalizing our first production run. Your ship date will be confirmed by email before your card is charged. The first run is limited; reserving now locks in your spot and the launch price."],
      ];
      const [open, setOpen] = useState(0);
      return (
        <section className="relative bg-cream px-8 md:px-16 lg:px-20 py-32">

                    className="w-full flex items-center justify-between gap-6 py-6 text-left"
                  >
                    <span className="text-base md:text-lg font-body font-medium text-white">{q}</span>
                    <ChevronDown className={`h-5 w-5 text-white/60 shrink-0 transition-transform ${open === i ? "rotate-180" : ""}`} />

                  <motion.div
                    initial={false}
                    animate={open === i ? { height: "auto", opacity: 1, marginBottom: 24 } : { height: 0, opacity: 0, marginBottom: 0 }}

                    <p className="text-sm md:text-base text-white/70 font-body font-light leading-relaxed pr-12">{a}</p>
